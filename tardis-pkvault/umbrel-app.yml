releaseNotes: >-
  Novidades na versão 2.3.0

  -Esta versão foi focada principalmente nas novas opções de exportação para Android e macOS.

  Recursos:

  - Novo idioma: Italiano.

  Correções:

  - Correção de conflitos entre arquivos de save quando OT, TID e SID são iguais
  - Correção da sincronização interrompida quando um Pokémon bebê evolui no arquivo de save
  - Correção de algumas fitas que não eram exibidas
  - Correção de erro ao carregar Pokémon com marcações ilegais