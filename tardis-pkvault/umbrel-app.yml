id: tardis-pkvault

name: PKVault

tagline: Seu Pokémon Home privado no Umbrel

icon: https://raw.githubusercontent.com/luankleber/tardis-umbrel-apps/master/tardis-pkvault/icon.png

category: Utilities

version: "2.3.0"

