releaseNotes: >-
  Novidades na versão 2.2.0

  - Novo idioma: Chinês Tradicional.

  Recursos:

  - Adição de painel de edição para duplicatas de arquivos de save na página de saves
  - Adição de opção de ordenação no painel de seleção de saves
  - (Docker) Adição de ações de upload e exclusão de saves
  - (Docker) Adição de explorador de arquivos para seleção de saves nas configurações
  - Reformulação de partes da página de configurações
  - Correções:

  - Correção de travamento em alguns sistemas com GPU Nvidia
  - Correção de travamento causado por timeouts do GitHub
  - Correção da deseleção após múltiplas liberações (releases)
  - Correção da liberação de múltiplas variantes
  - Correção de irregularidades pós-conversão (versão, fitas, EVs)
  - Correção do erro "Espécie incompatível" após a ação de mover em alguns saves
  - Correção de falha visual na Pokédex após a ação de mover
  - Correção na ação de reinício (fresh-start) do save, surgida na versão 2.1.2