releaseNotes: >-
  Novidades na versão 2.1.2

  - O logotipo do aplicativo foi alterado para atender às diretrizes das lojas (Flathub).
  - Corrigido travamento ao executar via Steam como um jogo não pertencente à Steam.
  - Corrigido problema de Pokédex vazia na ausência de arquivo de salvamento.
  - Corrigido problema de indisponibilidade de jogos japoneses da 1ª Geração (G1).
  - Detecção de idioma na primeira inicialização.
  - Usuários de Linux: o PKVault agora está disponível no Flathub!