version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: tardis-unss_app_1
      APP_PORT: 8989

  app:
    image: ghcr.io/prodeveloper0/unss-server:latest
    restart: unless-stopped
    stop_grace_period: 1m

    volumes:
      - ${APP_DATA_DIR}/data:/app/savedata
      - ${APP_DATA_DIR}/metadata.sqlite:/app/metadata.sqlite