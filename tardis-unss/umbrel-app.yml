releaseNotes: >-
  Primeira versão do uNSS para Umbrel.

  - Servidor uNSS hospedado localmente
  - Armazenamento persistente dos saves
  - Banco de dados persistente
  - Acesso pela dashboard do Umbrel
  - Compatível com sincronização de saves do Nintendo Switch